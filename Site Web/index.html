<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Déclaration du type de document HTML et définition de la langue en français -->
    <meta charset="UTF-8"> <!-- Encodage des caractères en UTF-8 pour supporter les caractères spéciaux -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Optimisation pour l'affichage sur appareils mobiles -->
    <title>Jeu de Yam's</title> <!-- Titre de la page -->
    <link rel="icon" href="./Images/Yam's.png"/> <!-- Icône de la page, affichée dans l'onglet du navigateur -->
    <link rel="stylesheet" href="style.css"> <!-- Lien vers la feuille de style externe -->
    <script src="script.js" defer></script>
</head>
<body class="theme-sombre"> <!-- Début du corps avec une classe "theme-sombre" pour un thème sombre par défaut -->
    <h1>Fiche resultat Yam's</h1> <!-- Titre principal de la page -->

    <!-- En-tête contenant le formulaire de chargement et les boutons de navigation -->
    <header>
        <!-- Formulaire pour entrer le nom du fichier JSON -->
        <form id="formulaireJSON">
            <label for="nomFichier">Nom du fichier JSON :</label>
            <input type="text" id="nomFichier" placeholder="exemple.json" onkeypress="VerifEntrer(event)">
            <button type="button" onclick="ChargerDonneeJeu()">Charger</button>
        </form>

        <!-- Boutons pour changer la vue et le thème -->
        <div id="boutonsVue">
            <button onclick="AfficherVueGlobale()">Vue Globale</button> <!-- Affiche la vue globale -->
            <button id="toggleTheme" onclick="ChangerTheme()">☀️</button> <!-- Change le thème entre sombre et clair -->
            <button onclick="AfficherVueParTour()">Vue Tour par Tour</button> <!-- Affiche la vue tour par tour -->
        </div>
    </header>

    <!-- Section pour la Vue Globale, cachée par défaut -->
    <section id="vueGlobale" style="display: none;">
        <h2>Vision globale d'une partie</h2>
        <div id="resumeGlobal"></div> <!-- Conteneur pour le résumé global de la partie -->
    </section>

    <!-- Section pour la Vue Tour par Tour, cachée par défaut -->
    <section id="vueTour" style="display: none;">
        <div class="tour-navigation-container">
            <!-- Navigation entre les tours -->
            <div class="navigation gauche">
                <button onclick="AfficherTourPrecedent()" data-label="Tour Précédent">⬅️</button> <!-- Bouton pour le tour précédent -->
            </div>
            <div class="tour-actuel" id="tourActuel">
                <!-- Contenu du tour affiché ici dynamiquement -->
            </div>
            <div class="navigation droite">
                <button onclick="AfficherTourSuivant()" data-label="Tour Suivant">➡️</button> <!-- Bouton pour le tour suivant -->
            </div>
        </div>

        <!-- Affichage des scores cumulés des joueurs -->
        <div id="scoresJoueurs">
            <h3>Scores Cumulés</h3>
            <!-- Les scores cumulés pour chaque joueur seront insérés ici -->
            <div id="scoreJoueur1"></div>
            <div id="scoreJoueur2"></div>
        </div>
    </section>

    <!-- Inclusion du fichier JavaScript externe pour la logique dynamique de la page -->
</body>
</html>
